name: Generate PSScrean Files Structure

on:
  workflow_dispatch:

jobs:
  create-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create Structure and Swift Files
        run: |
          python -c '
          import os

          PROJECT_NAME = "PSScrean"

          files = {
              f"{PROJECT_NAME}/App/{PROJECT_NAME}App.swift": """import SwiftUI

          @main
          struct PSScreanApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          """,
              f"{PROJECT_NAME}/Models/PS4Console.swift": """import Foundation

          struct PS4Console: Identifiable, Codable {
              var id = UUID()
              var profileName: String
              var psnOnlineId: String
              var pinCode: String
              var ipAddress: String
              var isAutoConnect: Bool = false
          }

          struct DiscoveredConsole: Identifiable {
              var id = UUID()
              var hostName: String
              var ipAddress: String
              var status: String
          }
          """,
              f"{PROJECT_NAME}/Services/NetworkDiscovery.swift": """import Foundation
          import Network

          class NetworkDiscovery: ObservableObject {
              @Published var discoveredConsoles: [DiscoveredConsole] = []
              @Published var isScanning = false
              
              private var listener: NWListener?
              
              func startDiscovery() {
                  isScanning = true
                  discoveredConsoles.removeAll()
                  
                  // Domyślny port wyszukiwania PS4 w sieci lokalnej (UDP 987)
                  let packet = "SRCH * HTTP/1.1\\r\\ndevice-discovery-protocol-version:0002000\\r\\n\\r\\n"
                  guard let data = packet.data(using: .utf8) else { return }
                  
                  let host = NWEndpoint.Host("255.255.255.255")
                  let port = NWEndpoint.Port(integerLiteral: 987)
                  
                  let connection = NWConnection(host: host, port: port, using: .udp)
                  connection.start(queue: .global())
                  
                  connection.send(content: data, completion: .contentProcessed({ error in
                      if let error = error {
                          print("Błąd wysyłania pakietu discovery: \\(error)")
                      }
                  }))
                  
                  // Wyłączanie skanowania po 5 sekundach
                  DispatchQueue.main.asyncAfter(deadline: .now() + 5.0) {
                      self.isScanning = false
                  }
              }
          }
          """,
              f"{PROJECT_NAME}/ViewModels/ConsoleManager.swift": """import Foundation

          class ConsoleManager: ObservableObject {
              @Published var consoles: [PS4Console] = [] {
                  didSet { saveConsoles() }
              }
              
              private let saveKey = "SavedPS4Consoles"
              
              init() { loadConsoles() }
              
              func addConsole(_ console: PS4Console) {
                  consoles.append(console)
              }
              
              func deleteConsole(at offsets: IndexSet) {
                  consoles.remove(atOffsets: offsets)
              }
              
              private func saveConsoles() {
                  if let encoded = try? JSONEncoder().encode(consoles) {
                      UserDefaults.standard.set(encoded, forKey: saveKey)
                  }
              }
              
              private func loadConsoles() {
                  if let data = UserDefaults.standard.data(forKey: saveKey),
                     let decoded = try? JSONDecoder().decode([PS4Console].self, from: data) {
                      consoles = decoded
                  }
              }
          }
          """,
              f"{PROJECT_NAME}/Views/VirtualControllerView.swift": """import SwiftUI

          struct VirtualControllerView: View {
              var body: some View {
                  HStack {
                      // D-PAD / Left Stick
                      VStack {
                          Button(action: {}) { Image(systemName: "chevron.up.circle.fill").font(.system(size: 45)) }
                          HStack(spacing: 20) {
                              Button(action: {}) { Image(systemName: "chevron.left.circle.fill").font(.system(size: 45)) }
                              Button(action: {}) { Image(systemName: "chevron.right.circle.fill").font(.system(size: 45)) }
                          }
                          Button(action: {}) { Image(systemName: "chevron.down.circle.fill").font(.system(size: 45)) }
                      }
                      .foregroundColor(.white.opacity(0.8))
                      
                      Spacer()
                      
                      // Action Buttons (Triangle, Circle, Cross, Square)
                      VStack {
                          Button(action: {}) { Image(systemName: "triangle.circle.fill").font(.system(size: 45)).foregroundColor(.green) }
                          HStack(spacing: 20) {
                              Button(action: {}) { Image(systemName: "square.circle.fill").font(.system(size: 45)).foregroundColor(.pink) }
                              Button(action: {}) { Image(systemName: "circle.circle.fill").font(.system(size: 45)).foregroundColor(.red) }
                          }
                          Button(action: {}) { Image(systemName: "multiply.circle.fill").font(.system(size: 45)).foregroundColor(.blue) }
                      }
                  }
                  .padding(.horizontal, 30)
              }
          }
          """,
              f"{PROJECT_NAME}/Views/StreamView.swift": """import SwiftUI

          struct StreamView: View {
              let console: PS4Console
              
              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()
                      
                      VStack {
                          HStack {
                              Text("PS4 Stream: \\(console.profileName)")
                                  .font(.caption)
                                  .foregroundColor(.gray)
                              Spacer()
                          }
                          .padding()
                          
                          Spacer()
                          
                          // Wirtualny pad nakładany na obraz
                          VirtualControllerView()
                              .padding(.bottom, 20)
                      }
                  }
                  .navigationBarTitleDisplayMode(.inline)
              }
          }
          """,
              f"{PROJECT_NAME}/Views/ContentView.swift": """import SwiftUI

          struct ContentView: View {
              @StateObject private var manager = ConsoleManager()
              @StateObject private var discovery = NetworkDiscovery()
              @State private var showingAddModal = false
              
              var body: some View {
                  NavigationView {
                      List {
                          Section(header: Text("Automatyczne wyszukiwanie Wi-Fi")) {
                              Button(action: { discovery.startDiscovery() }) {
                                  HStack {
                                      Image(systemName: "wifi")
                                      Text(discovery.isScanning ? "Skanowanie sieci..." : "Szukaj PS4 w sieci Wi-Fi")
                                      if discovery.isScanning {
                                          Spacer()
                                          ProgressView()
                                      }
                                  }
                              }
                          }
                          
                          Section(header: Text("Zapisane Konsole")) {
                              if manager.consoles.isEmpty {
                                  Text("Brak zapisanych konsol. Kliknij +, aby dodać.")
                                      .foregroundColor(.gray)
                                      .font(.subheadline)
                              } else {
                                  ForEach(manager.consoles) { console in
                                      NavigationLink(destination: StreamView(console: console)) {
                                          HStack {
                                              Image(systemName: "playstation.house.fill")
                                                  .foregroundColor(.blue)
                                              VStack(alignment: .leading) {
                                                  Text(console.profileName).font(.headline)
                                                  Text("IP: \\(console.ipAddress)").font(.caption).foregroundColor(.gray)
                                              }
                                          }
                                      }
                                  }
                                  .onDelete(perform: manager.deleteConsole)
                              }
                          }
                      }
                      .navigationTitle("PSScrean")
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button(action: { showingAddModal = true }) {
                                  Image(systemName: "plus")
                              }
                          }
                      }
                      .sheet(isPresented: $showingAddModal) {
                          AddConsoleView(manager: manager)
                      }
                  }
              }
          }
          """,
              f"{PROJECT_NAME}/Views/AddConsoleView.swift": """import SwiftUI

          struct AddConsoleView: View {
              @Environment(\\.dismiss) var dismiss
              @ObservedObject var manager: ConsoleManager
              
              @State private var profileName = ""
              @State private var psnOnlineId = ""
              @State private var pinCode = ""
              @State private var ipAddress = ""
              
              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("Profil konsoli")) {
                              TextField("Nazwa (np. Salon)", text: $profileName)
                              TextField("Nick PSN ID", text: $psnOnlineId)
                                  .autocapitalization(.none)
                          }
                          
                          Section(header: Text("Połączenie PS4")) {
                              TextField("Kod PIN z PS4 (8 cyfr)", text: $pinCode)
                                  .keyboardType(.numberPad)
                              TextField("Adres IP PS4 (np. 192.168.1.50)", text: $ipAddress)
                                  .keyboardType(.decimalPad)
                          }
                      }
                      .navigationTitle("Dodaj PS4")
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) { Button("Anuluj") { dismiss() } }
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Zapisz") {
                                  manager.addConsole(PS4Console(profileName: profileName, psnOnlineId: psnOnlineId, pinCode: pinCode, ipAddress: ipAddress))
                                  dismiss()
                              }
                              .disabled(profileName.isEmpty || pinCode.isEmpty || ipAddress.isEmpty)
                          }
                      }
                  }
              }
          }
          """
          }

          for path, content in files.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip())
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PSScrean/
          git commit -m "Add UDP Discovery service and VirtualControllerView" || exit 0
          git push
