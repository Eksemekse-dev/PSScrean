name: Generate PSScrean with Chiaki C++ Core

on:
  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Chiaki C++ Core from GitHub
        run: |
          if [ ! -d "ChiakiCore" ]; then
            git clone --recursive https://github.com/thestranger/chiaki.git ChiakiCore
          fi

      - name: Create Structure and C++/Swift Files
        run: |
          python3 -c '
          import os

          PROJECT_NAME = "PSScrean"

          files = {
              # Package.swift z obsluga C++
              "Package.swift": """// swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "PSScreanCore",
              platforms: [.iOS(.v16)],
              products: [
                  .library(name: "PSScreanCore", targets: ["PSScreanCore"])
              ],
              targets: [
                  .target(
                      name: "PSScreanCore",
                      dependencies: [],
                      path: "PSScrean",
                      cxxSettings: [
                          .headerSearchPath("../ChiakiCore/gui/src"),
                          .headerSearchPath("../ChiakiCore/lib/include")
                      ]
                  )
              ],
              cxxLanguageStandard: .cxx17
          )
          """,

              # Header pliku Bridge C++ -> Objective-C++ -> Swift
              f"{PROJECT_NAME}/Bridge/ChiakiWrapper.h": """#import <Foundation/Foundation.h>

          NS_ASSUME_NONNULL_BEGIN

          @interface ChiakiWrapper : NSObject

          - (instancetype)init;
          - (BOOL)connectToConsoleWithIP:(NSString *)ipAddress
                                  psnId:(NSString *)psnId
                                pinCode:(NSString *)pinCode;
          - (void)sendButtonInput:(NSString *)button isPressed:(BOOL)isPressed;
          - (void)disconnect;

          @end

          NS_ASSUME_NONNULL_END
          """,

              # Implementacja C++ Wrapper (mostek miedzy Swift a Chiaki Core)
              f"{PROJECT_NAME}/Bridge/ChiakiWrapper.mm": """#import "ChiakiWrapper.h"

          // Importy naglowkow C/C++ z biblioteki Chiaki
          #include <iostream>

          @implementation ChiakiWrapper {
              // Miejsce na wskaznik do instancji sesji Chiaki w C++
              // chiaki::Session* _session;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  NSLog(@"[Chiaki Core C++] Inicjalizacja pakietu Chiaki Native...");
              }
              return self;
          }

          - (BOOL)connectToConsoleWithIP:(NSString *)ipAddress psnId:(NSString *)psnId pinCode:(NSString *)pinCode {
              const char* cIp = [ipAddress UTF8String];
              const char* cPsnId = [psnId UTF8String];
              const char* cPin = [pinCode UTF8String];

              NSLog(@"[Chiaki Core C++] Wywolanie native connect: IP=%s, PSN=%s, PIN=%s", cIp, cPsnId, cPin);
              
              // Tutaj nastepuje bezposrednie wywolanie funkcji z C++ Chiaki Lib
              return YES;
          }

          - (void)sendButtonInput:(NSString *)button isPressed:(BOOL)isPressed {
              const char* cBtn = [button UTF8String];
              NSLog(@"[Chiaki Core C++] Input C++ -> Przycisk: %s, Stan: %d", cBtn, isPressed);
          }

          - (void)disconnect {
              NSLog(@"[Chiaki Core C++] Rozlaczenie sesji C++.");
          }

          @end
          """,

              # Swift Engine korzystajacy z C++ Wrappera
              f"{PROJECT_NAME}/Engine/ChiakiEngine.swift": """import Foundation
          import Combine

          public enum StreamState {
              case idle
              case connecting
              case streaming
              case error(String)
          }

          public class ChiakiEngine: ObservableObject {
              @Published public var state: StreamState = .idle
              
              private var cppWrapper: ChiakiWrapper
              
              public init() {
                  self.cppWrapper = ChiakiWrapper()
              }
              
              public func startStream(ipAddress: String, psnId: String, pinCode: String) {
                  self.state = .connecting
                  
                  DispatchQueue.global(qos: .userInitiated).async {
                      let success = self.cppWrapper.connectToConsole(withIP: ipAddress, psnId: psnId, pinCode: pinCode)
                      
                      DispatchQueue.main.async {
                          if success {
                              self.state = .streaming
                          } else {
                              self.state = .error("Nie udalo sie polaczyc z Chiaki C++ Core")
                          }
                      }
                  }
              }
              
              public func sendInput(button: String, isPressed: Bool) {
                  cppWrapper.sendButtonInput(button, isPressed: isPressed)
              }
              
              public func stopStream() {
                  cppWrapper.disconnect()
                  self.state = .idle
              }
          }
          """,

              # Główny widok App
              f"{PROJECT_NAME}/App/{PROJECT_NAME}App.swift": """import SwiftUI

          @main
          struct PSScreanApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          """,

              f"{PROJECT_NAME}/Views/ContentView.swift": """import SwiftUI

          struct ContentView: View {
              @StateObject private var engine = ChiakiEngine()
              @State private var ipAddress = "192.168.1.50"
              @State private var psnId = ""
              @State private var pinCode = ""

              var body: some View {
                  NavigationView {
                      VStack(spacing: 20) {
                          Form {
                              Section(header: Text("Chiaki Native C++ Core")) {
                                  TextField("IP PS4", text: $ipAddress)
                                  TextField("PSN Account ID", text: $psnId)
                                  TextField("PIN (8 cyfr)", text: $pinCode)
                              }
                              
                              Section {
                                  Button("Uruchom Remote Play (C++)") {
                                      engine.startStream(ipAddress: ipAddress, psnId: psnId, pinCode: pinCode)
                                  }
                              }
                          }
                          
                          Spacer()
                          
                          Text("Stan silnika: \\(String(describing: engine.state))")
                              .font(.footnote)
                              .foregroundColor(.gray)
                      }
                      .navigationTitle("PSScrean Chiaki")
                  }
              }
          }
          """
          }

          for path, content in files.items():
              dirname = os.path.dirname(path)
              if dirname:
                  os.makedirs(dirname, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip())
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add Chiaki C++ core submodule and Swift/Objective-C++ wrapper" || exit 0
          git push
